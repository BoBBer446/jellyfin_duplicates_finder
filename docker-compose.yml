services:
  jellyfin-duplicate-finder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jellyfin-duplicate-finder
    ports:
      - "8000:8000"
    environment:
      - JELLYFIN_HOME_IP=${JELLYFIN_HOME_IP:-}
      - JELLYFIN_HOME_PORT=${JELLYFIN_HOME_PORT:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
