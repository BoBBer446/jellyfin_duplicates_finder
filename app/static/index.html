<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jellyfin Duplicate Finder</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --panel: #ffffff;
        --ink: #132531;
        --muted: #5f7685;
        --line: #d6e0e7;
        --accent: #147a9a;
        --accent-2: #e56a35;
        --danger: #c12f2f;
        --ok: #1f8b4c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at 10% -10%, #c7e7ef 0%, transparent 40%), var(--bg);
      }

      .shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 18px 40px;
      }

      .hero {
        background: linear-gradient(120deg, #0d5f78, #173a4a);
        color: #f5fbff;
        border-radius: 20px;
        padding: 28px;
        margin-bottom: 18px;
        box-shadow: 0 12px 30px rgba(12, 48, 62, 0.18);
        animation: lift 450ms ease-out both;
      }

      .hero h1 {
        margin: 0 0 8px;
        font-size: clamp(1.45rem, 2.5vw, 2rem);
        letter-spacing: 0.02em;
      }

      .hero p {
        margin: 0;
        color: #d9edf5;
      }

      .grid {
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
        gap: 16px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        animation: fade 500ms ease-out both;
      }

      .panel h2 {
        margin: 0 0 14px;
        font-size: 1.05rem;
      }

      .stack {
        display: grid;
        gap: 10px;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      input,
      select,
      button {
        font: inherit;
      }

      input[type="text"],
      input[type="password"],
      input[type="search"],
      input[type="file"] {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 11px;
        background: #fff;
        color: var(--ink);
      }

      .choices {
        display: flex;
        gap: 14px;
        color: var(--ink);
      }

      .choices label {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--ink);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        cursor: pointer;
        background: #e6edf2;
        color: var(--ink);
      }

      button.primary {
        background: var(--accent);
        color: #fff;
      }

      button.warn {
        background: var(--accent-2);
        color: #fff;
      }

      button.danger {
        background: var(--danger);
        color: #fff;
      }

      button[disabled] {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .status {
        min-height: 1.25rem;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .status.error {
        color: var(--danger);
      }

      .status.ok {
        color: var(--ok);
      }

      .summary {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
      }

      .metric {
        border-top: 3px solid var(--accent);
        padding-top: 8px;
        min-width: 145px;
      }

      .metric b {
        display: block;
        font-size: 1.2rem;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 14px;
      }

      .group {
        padding: 12px 0 14px;
        border-top: 1px solid var(--line);
      }

      .group h3 {
        margin: 0 0 8px;
        font-size: 1rem;
      }

      .small {
        margin: 0;
        color: var(--muted);
        font-size: 0.86rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
      }

      th,
      td {
        text-align: left;
        border-bottom: 1px solid #edf2f5;
        padding: 8px 6px;
        font-size: 0.88rem;
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-weight: 600;
      }

      .tag {
        display: inline-block;
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 0.75rem;
      }

      .tag.keep {
        background: #dcf4e5;
        color: #1e6b3c;
      }

      .tag.del {
        background: #fde4db;
        color: #983322;
      }

      .mono {
        font-family: "Cascadia Code", "Consolas", monospace;
        font-size: 0.78rem;
      }

      @keyframes lift {
        from {
          transform: translateY(10px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @media (max-width: 980px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <h1>Jellyfin Duplicate Finder</h1>
        <p>Scanne deine Bibliothek, markiere Duplikate gezielt und loesche nur was du wirklich willst.</p>
      </section>

      <section class="grid">
        <aside class="panel">
          <h2>Scan starten</h2>
          <div class="stack">
            <label for="baseUrl">
              Jellyfin URL
              <input id="baseUrl" type="text" placeholder="https://jellyfin.home" />
            </label>
            <label for="apiKey">
              API Key
              <input id="apiKey" type="password" placeholder="Jellyfin API Key" />
            </label>
            <div>
              <label style="margin-bottom: 6px">Medientyp</label>
              <div class="choices">
                <label><input id="typeMovie" type="checkbox" checked /> Movie</label>
                <label><input id="typeSeries" type="checkbox" /> Series</label>
              </div>
            </div>
            <label for="customSequences">
              Sequenzen (optional, erweitert bereits eingebaut)
              <input
                id="customSequences"
                type="text"
                placeholder="Nur falls du eigene Marker brauchst, z. B. BONUS1,BONUS2"
              />
            </label>
            <label style="display: flex; align-items: center; gap: 8px; color: var(--ink)">
              <input id="verifySsl" type="checkbox" checked />
              SSL-Zertifikat pruefen (bei selbstsigniert aus)
            </label>
            <button id="scanJellyfinBtn" class="primary">Jellyfin scannen</button>
          </div>

          <hr style="margin: 16px 0; border: 0; border-top: 1px solid var(--line)" />

          <h2>Oder JSON hochladen</h2>
          <div class="stack">
            <label for="jsonFile">
              JSON Datei
              <input id="jsonFile" type="file" accept=".json,application/json" />
            </label>
            <button id="scanFileBtn">Datei scannen</button>
          </div>

          <p id="status" class="status"></p>
        </aside>

        <section class="panel">
          <h2>Duplikate</h2>
          <div id="summary" class="summary"></div>
          <div class="toolbar">
            <label style="margin-right: auto; min-width: 280px">
              Suche in Ergebnissen
              <input id="filterInput" type="search" placeholder="Titel oder Pfad filtern" />
            </label>
            <button id="selectAllBtn">Alle markieren</button>
            <button id="selectNoneBtn">Auswahl leeren</button>
            <button id="dryRunBtn" class="warn">Dry Run</button>
            <button id="deleteBtn" class="danger">Auswahl loeschen</button>
          </div>
          <div id="results"></div>
        </section>
      </section>
    </main>

    <script>
      const statusEl = document.getElementById("status");
      const summaryEl = document.getElementById("summary");
      const resultsEl = document.getElementById("results");
      const filterInput = document.getElementById("filterInput");
      const deleteBtn = document.getElementById("deleteBtn");
      const dryRunBtn = document.getElementById("dryRunBtn");

      let scanResult = null;
      let selectedDeleteIds = new Set();

      function setStatus(message, tone = "") {
        statusEl.className = `status ${tone}`.trim();
        statusEl.textContent = message;
      }

      function esc(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function formatBytes(bytes) {
        const value = Number(bytes) || 0;
        if (value === 0) return "0 B";
        const units = ["B", "KB", "MB", "GB", "TB"];
        const i = Math.min(Math.floor(Math.log(value) / Math.log(1024)), units.length - 1);
        return `${(value / Math.pow(1024, i)).toFixed(2)} ${units[i]}`;
      }

      function formatResolution(px) {
        if (!px) return "-";
        return `${Math.round(px / 1_000_000)} MP`;
      }

      function renderSummary() {
        if (!scanResult) {
          summaryEl.innerHTML = "<p class='small'>Noch kein Scan gestartet.</p>";
          return;
        }

        summaryEl.innerHTML = `
          <div class="metric"><span>Scan ID</span><b class="mono">${esc(scanResult.scan_id)}</b></div>
          <div class="metric"><span>Gesamt</span><b>${esc(scanResult.summary.total_items)}</b></div>
          <div class="metric"><span>Gruppen</span><b>${esc(scanResult.summary.duplicate_groups)}</b></div>
          <div class="metric"><span>Loeschbar</span><b>${esc(scanResult.summary.duplicate_items_to_delete)}</b></div>
        `;
      }

      function renderGroups() {
        if (!scanResult) {
          resultsEl.innerHTML = "";
          deleteBtn.disabled = true;
          dryRunBtn.disabled = true;
          return;
        }

        const filter = filterInput.value.trim().toLowerCase();
        const groups = scanResult.groups.filter((group) => {
          if (!filter) return true;
          const inIdentifier = group.identifier.toLowerCase().includes(filter);
          const inItems = group.items.some((item) => (item.path || "").toLowerCase().includes(filter));
          return inIdentifier || inItems;
        });

        if (groups.length === 0) {
          resultsEl.innerHTML = "<p class='small'>Keine passenden Duplikate im aktuellen Filter.</p>";
          deleteBtn.disabled = true;
          dryRunBtn.disabled = true;
          return;
        }

        resultsEl.innerHTML = groups
          .map((group) => {
            const rows = group.items
              .map((item) => {
                const isKeep = item.id === group.keep_item_id;
                const isChecked = selectedDeleteIds.has(item.id);
                const badge = isKeep ? "<span class='tag keep'>KEEP</span>" : "<span class='tag del'>DELETE</span>";
                return `
                  <tr>
                    <td>${badge}</td>
                    <td>${isKeep ? "" : `<input type="checkbox" data-delete-id="${esc(item.id)}" ${isChecked ? "checked" : ""} />`}</td>
                    <td class="mono">${esc(item.id)}</td>
                    <td>${esc(item.name || "-")} ${item.year ? `(${esc(item.year)})` : ""}</td>
                    <td>${esc(item.path || "-")}</td>
                    <td>${formatBytes(item.size)}</td>
                    <td>${formatResolution(item.resolution)}</td>
                  </tr>
                `;
              })
              .join("");

            return `
              <article class="group">
                <h3>${esc(group.identifier)}</h3>
                <p class="small">Beste Datei bleibt: <span class="mono">${esc(group.keep_item_id)}</span></p>
                <table>
                  <thead>
                    <tr>
                      <th>Status</th>
                      <th>Mark</th>
                      <th>ID</th>
                      <th>Titel</th>
                      <th>Pfad</th>
                      <th>Groesse</th>
                      <th>Qualitaet</th>
                    </tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </article>
            `;
          })
          .join("");

        const deletable = scanResult.source === "jellyfin";
        deleteBtn.disabled = !deletable;
        dryRunBtn.disabled = !deletable;
        if (!deletable) {
          setStatus("Scan aus Datei: Loeschen ist nur bei Jellyfin-Scans moeglich.", "error");
        }
      }

      async function scanJellyfin() {
        const includeItemTypes = [];
        if (document.getElementById("typeMovie").checked) includeItemTypes.push("Movie");
        if (document.getElementById("typeSeries").checked) includeItemTypes.push("Series");
        if (includeItemTypes.length === 0) {
          setStatus("Bitte mindestens einen Medientyp auswaehlen.", "error");
          return;
        }

        const payload = {
          base_url: document.getElementById("baseUrl").value.trim(),
          api_key: document.getElementById("apiKey").value.trim(),
          include_item_types: includeItemTypes,
          verify_ssl: document.getElementById("verifySsl").checked,
          custom_sequences: document
            .getElementById("customSequences")
            .value.split(",")
            .map((entry) => entry.trim())
            .filter(Boolean),
        };

        if (!payload.base_url || !payload.api_key) {
          setStatus("Jellyfin URL und API Key sind erforderlich.", "error");
          return;
        }

        setStatus("Scan laeuft ...");
        try {
          const response = await fetch("/api/v1/scans/jellyfin", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const body = await response.json();
          if (!response.ok) throw new Error(body.detail || "Scan fehlgeschlagen");

          scanResult = body;
          selectedDeleteIds = new Set();
          scanResult.groups.forEach((group) => group.delete_candidates.forEach((id) => selectedDeleteIds.add(id)));
          renderSummary();
          renderGroups();
          setStatus("Scan abgeschlossen. Duplikate sind markiert.", "ok");
        } catch (error) {
          setStatus(error.message || "Scan fehlgeschlagen.", "error");
        }
      }

      async function scanFile() {
        const file = document.getElementById("jsonFile").files[0];
        if (!file) {
          setStatus("Bitte zuerst eine JSON-Datei auswaehlen.", "error");
          return;
        }

        const form = new FormData();
        form.append("file", file);
        form.append("custom_sequences", document.getElementById("customSequences").value || "");

        setStatus("Datei wird analysiert ...");
        try {
          const response = await fetch("/api/v1/scans/file", { method: "POST", body: form });
          const body = await response.json();
          if (!response.ok) throw new Error(body.detail || "Datei-Scan fehlgeschlagen");

          scanResult = body;
          selectedDeleteIds = new Set();
          renderSummary();
          renderGroups();
          setStatus("Datei-Scan abgeschlossen.", "ok");
        } catch (error) {
          setStatus(error.message || "Datei-Scan fehlgeschlagen.", "error");
        }
      }

      async function runDelete(dryRun) {
        if (!scanResult) {
          setStatus("Bitte erst einen Scan ausfuehren.", "error");
          return;
        }
        if (scanResult.source !== "jellyfin") {
          setStatus("Loeschen ist nur mit Jellyfin-Scan moeglich.", "error");
          return;
        }

        const itemIds = Array.from(selectedDeleteIds);
        if (itemIds.length === 0) {
          setStatus("Keine Duplikate markiert.", "error");
          return;
        }

        setStatus(dryRun ? "Dry Run laeuft ..." : "Loeschen laeuft ...");
        try {
          const response = await fetch(`/api/v1/scans/${scanResult.scan_id}/delete`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ dry_run: dryRun, item_ids: itemIds }),
          });
          const body = await response.json();
          if (!response.ok) throw new Error(body.detail || "Loeschvorgang fehlgeschlagen");

          if (dryRun) {
            setStatus(`Dry Run ok: ${body.requested_ids.length} IDs waeren betroffen.`, "ok");
            return;
          }

          const failedCount = Object.keys(body.failed_ids).length;
          if (failedCount > 0) {
            const firstFailure = Object.entries(body.failed_ids)[0];
            setStatus(
              `Geloescht: ${body.deleted_ids.length}, Fehler: ${failedCount}. Beispiel: ${firstFailure[0]} -> ${firstFailure[1]}`,
              "error",
            );
          } else {
            setStatus(`Geloescht: ${body.deleted_ids.length}, Fehler: 0`, "ok");
          }
          const refreshed = await fetch(`/api/v1/scans/${scanResult.scan_id}`);
          const refreshedBody = await refreshed.json();
          if (refreshed.ok) {
            scanResult = refreshedBody;
            selectedDeleteIds = new Set();
            renderSummary();
            renderGroups();
          }
        } catch (error) {
          setStatus(error.message || "Loeschvorgang fehlgeschlagen.", "error");
        }
      }

      document.getElementById("scanJellyfinBtn").addEventListener("click", scanJellyfin);
      document.getElementById("scanFileBtn").addEventListener("click", scanFile);
      resultsEl.addEventListener("change", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLInputElement)) return;
        if (!target.matches("input[data-delete-id]")) return;
        const id = target.getAttribute("data-delete-id");
        if (!id) return;
        if (target.checked) selectedDeleteIds.add(id);
        else selectedDeleteIds.delete(id);
      });
      document.getElementById("selectAllBtn").addEventListener("click", () => {
        if (!scanResult) return;
        selectedDeleteIds = new Set();
        scanResult.groups.forEach((group) => group.delete_candidates.forEach((id) => selectedDeleteIds.add(id)));
        renderGroups();
        setStatus("Alle loeschbaren Duplikate markiert.", "ok");
      });
      document.getElementById("selectNoneBtn").addEventListener("click", () => {
        selectedDeleteIds = new Set();
        renderGroups();
        setStatus("Auswahl geleert.");
      });
      dryRunBtn.addEventListener("click", () => runDelete(true));
      deleteBtn.addEventListener("click", () => runDelete(false));
      filterInput.addEventListener("input", renderGroups);

      renderSummary();
      renderGroups();
      setStatus("Bereit.");
    </script>
  </body>
</html>
